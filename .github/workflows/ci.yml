name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests
        run: ./mvnw -B verify

      - name: Publish coverage summary
        if: always()
        run: |
          csv=target/site/jacoco/jacoco.csv
          if [ ! -f "$csv" ]; then
            echo "No coverage report was produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          awk -F, '
            NR > 1 {
              im += $4; ic += $5
              bm += $6; bc += $7
              lm += $8; lc += $9
            }
            function pct(c, m) { return (c + m) == 0 ? "n/a" : sprintf("%.1f%%", 100 * c / (c + m)) }
            END {
              print "## Test coverage (JaCoCo)"
              print ""
              print "| Counter | Covered | Missed | Coverage |"
              print "|---|---:|---:|---:|"
              printf "| Instructions | %d | %d | %s |\n", ic, im, pct(ic, im)
              printf "| Branches | %d | %d | %s |\n", bc, bm, pct(bc, bm)
              printf "| Lines | %d | %d | %s |\n", lc, lm, pct(lc, lm)
            }
          ' "$csv" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore
