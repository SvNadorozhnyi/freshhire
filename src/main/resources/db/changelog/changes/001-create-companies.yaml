databaseChangeLog:
  - changeSet:
      id: create-companies
      author: svnadorozhnyi
      changes:
        - createTable:
            tableName: companies
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_companies
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: ats_type
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: board_token
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: last_collected_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: last_collection_status
                  type: varchar(32)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: companies
            columnNames: ats_type, board_token
            constraintName: uq_companies_ats_type_board_token
        - sql:
            sql: >-
              ALTER TABLE companies
              ADD CONSTRAINT ck_companies_ats_type
              CHECK (ats_type IN ('GREENHOUSE', 'LEVER'))
        - sql:
            sql: >-
              ALTER TABLE companies
              ADD CONSTRAINT ck_companies_last_collection_status
              CHECK (last_collection_status IN ('SUCCESS', 'FAILED'))
      rollback:
        - dropTable:
            tableName: companies
