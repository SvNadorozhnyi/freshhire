databaseChangeLog:
  - changeSet:
      id: create-job-postings
      author: svnadorozhnyi
      changes:
        - createTable:
            tableName: job_postings
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_job_postings
              - column:
                  name: company_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: external_id
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: locations
                  type: JSONB
                  defaultValueComputed: "'[]'::jsonb"
                  constraints:
                    nullable: false
              - column:
                  name: department
                  type: text
              - column:
                  name: remote
                  type: BOOLEAN
              - column:
                  name: url
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: description_text
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: content_hash
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: source_published_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: source_updated_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: first_seen_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: last_seen_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: closed_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: job_postings
            columnNames: company_id, external_id
            constraintName: uq_job_postings_company_id_external_id
        - addForeignKeyConstraint:
            baseTableName: job_postings
            baseColumnNames: company_id
            referencedTableName: companies
            referencedColumnNames: id
            constraintName: fk_job_postings_company
            onDelete: RESTRICT
        - createIndex:
            tableName: job_postings
            indexName: idx_job_postings_content_hash
            columns:
              - column:
                  name: content_hash
        - sql:
            sql: >-
              ALTER TABLE job_postings
              ADD CONSTRAINT ck_job_postings_locations_array
              CHECK (jsonb_typeof(locations) = 'array')
        - sql:
            sql: >-
              ALTER TABLE job_postings
              ADD CONSTRAINT ck_job_postings_seen_order
              CHECK (last_seen_at >= first_seen_at)
      rollback:
        - dropTable:
            tableName: job_postings
