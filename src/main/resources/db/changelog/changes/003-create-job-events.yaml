databaseChangeLog:
  - changeSet:
      id: create-job-events
      author: svnadorozhnyi
      changes:
        - createTable:
            tableName: job_events
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_job_events
              - column:
                  name: job_posting_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: occurred_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: details
                  type: JSONB
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: job_events
            baseColumnNames: job_posting_id
            referencedTableName: job_postings
            referencedColumnNames: id
            constraintName: fk_job_events_job_posting
            onDelete: CASCADE
        - createIndex:
            tableName: job_events
            indexName: idx_job_events_posting_occurred
            columns:
              - column:
                  name: job_posting_id
              - column:
                  name: occurred_at
        - sql:
            sql: >-
              ALTER TABLE job_events
              ADD CONSTRAINT ck_job_events_type
              CHECK (type IN ('FIRST_SEEN', 'UPDATED', 'REPOSTED', 'CLOSED', 'REOPENED'))
        - sql:
            sql: >-
              ALTER TABLE job_events
              ADD CONSTRAINT ck_job_events_details_object
              CHECK (details IS NULL OR jsonb_typeof(details) = 'object')
      rollback:
        - dropTable:
            tableName: job_events
